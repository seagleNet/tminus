name: Release

# Push a tag like `v0.1.0` to build binaries and publish a GitHub release.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="tminus-${GITHUB_REF_NAME}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/t-"
          mkdir -p "$name/completions"
          cp "$bin" README.md LICENSE "$name/"
          # Each runner builds for its own architecture, so the binary runs here.
          "$bin" completions bash > "$name/completions/t-.bash"
          "$bin" completions zsh > "$name/completions/_t-"
          "$bin" completions fish > "$name/completions/t-.fish"
          "$bin" man > "$name/t-.1"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: tminus-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: tminus-*.tar.gz*
          generate_release_notes: true
